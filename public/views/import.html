<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/../css/styles.css">

    <title>Search Results</title>
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700&display=swap" rel="stylesheet">
</head>

<body class="import-page">
    <header class="page-header">
        <div class="header-inner">
            <a href="/" class="logo-link" title="Home">
                <img src="/assets/apod-logo.webp" alt="APOD logo" class="logo">
            </a>
            <h1 id="importTitle">Import APODs</h1>
            <div class="search-wrapper">
                <div>
                    <button id="home-btn">Return Home</button>
                </div>
                <form action="/search-results" method="get" class="search-wrapper">
                    <input type="search" name="q" placeholder="Search" id="searchField" />
                    <button id="searchBtn">Submit</button>
                </form>
            </div>
        </div>
    </header>
    <div id="import_container">
        <div id="import_body">
            <h2>Max 30 days per import</h2>
            <div class="import-form" id="import-form">
                <form action="/import" method="post">
                    <label for="startdate">Start Date</label>
                    <input type="date" id="startdate" name="startdate">
                    <label for="enddate">End Date</label>
                    <input type="date" id="enddate" name="enddate">
                    <button type="submit" id="submit">Import</button>
                </form>
            </div>
        </div>
        <div id="import-result" class="invisible"></div>
        <div id="import-apods"></div>
    </div>



</body>
<script type="module" src="/js/import.js"></script>

</html>
